plugins {
    id("java-library")
    id("xyz.jpenilla.run-velocity") version "3.0.2"
    id("com.gradleup.shadow") version "8.3.6"
}

dependencies {
    compileOnly("com.velocitypowered:velocity-api:3.5.0-SNAPSHOT")
    compileOnly("com.google.code.gson:gson:2.11.0")

    // Quipt is provided by the Quipt integration/plugin at runtime. Mark as compileOnly
    // so we don't bundle a second copy into this plugin (which causes classloader/type mismatches).
    compileOnly("live.qsmc.quipt:core:${quipt_version}")
    compileOnly("live.qsmc.quipt:velocity:${quipt_version}-MC${minecraft_version}")
    implementation "org.json:json:$json_version"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")
}

tasks {
    runVelocity {
        velocityVersion("3.5.0-SNAPSHOT")
    }
    jar {
        enabled = false
    }
    shadowJar {
        archiveBaseName.set("qsync-velocity")
        archiveClassifier.set("")
    }
    build {
        dependsOn(shadowJar)
    }
    publish {
        dependsOn(shadowJar)
    }
    processResources {
        def pluginProperties = [version: version]
        inputs.properties pluginProperties
        filteringCharset = 'UTF-8'
        duplicatesStrategy = DuplicatesStrategy.INCLUDE


        filesMatching('velocity-plugin.json') {
            expand pluginProperties
        }
    }
}

publishing {
    publications {
        shadow(MavenPublication) {
            artifactId = "velocity"
            from components.shadow
        }
    }
}
